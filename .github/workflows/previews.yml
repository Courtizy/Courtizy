# Redraws the README's two preview cards from each model's published results, so the profile
# always shows today's answer. Commits only when a card or its alt text changed.
name: Previews

on:
  schedule:
    - cron: "41 12 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw the cards from the live sites
        run: python scripts/render_previews.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- previews README.md; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews README.md
          git commit -m "Previews: redraw from the published results"
          git push
